[package]
name = "iroh-ssh"
description = "ssh without ip"
license = "MIT"
authors = ["Zacharias Boehler <rustonbsd@mailfence.com>"]
repository = "https://github.com/rustonbsd/iroh-ssh"
readme = "README.md"
keywords = ["networking"]
categories = ["network-programming"]
version = "0.2.12"
edition = "2024"

[[bin]]
name = "iroh-ssh"
required-features = ["cli"]

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["cli"]
cli = [
    "dep:clap",
    "dep:homedir",
    "dep:runas",
    "dep:self-runas",
    "dep:tempfile",
    "dep:tokio-stream",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
    "dep:whoami",
    "dep:z32",
    "tokio/process",
    "tokio/signal",
]
flutter = ["dep:flutter_rust_bridge"]

[dependencies]
anyhow = "1.0.104"
iroh = "1.3.0"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.10.3"
tokio-stream = { version = "0.1.19", features = ["sync"], optional = true }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "ansi"], optional = true }
tracing-appender = { version = "0.2.5", optional = true }
tokio = { version = "1.53.2", features = ["macros", "io-util", "io-std", "net", "rt-multi-thread", "sync", "time"] }
clap = { version = "4.6.1", features = ["derive"], optional = true }
homedir = { version = "0.3.6", optional = true }
whoami = { version = "2.1.3", optional = true }
z32 = { version = "1.3", optional = true }
runas = { version = "1.2.0", optional = true }
tempfile = { version = "3.27.0", optional = true }
self-runas = { version = "0.1", optional = true }
regex = "1.13.1"
flutter_rust_bridge = { version = "2", optional = true }

[target.'cfg(windows)'.dependencies.windows-service]
version = "0.8.1"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(unix)'.dependencies.libc]
version = "0.2.190"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
